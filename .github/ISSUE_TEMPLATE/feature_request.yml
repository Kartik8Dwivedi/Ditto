name: "✨ Feature request"
description: "Suggest an idea or improvement for Ditto."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New language adapter (tree-sitter → Python/Go/Java)
        - Ditto Guard / per-PR
        - Agent pre-flight (MCP)
        - Incremental re-indexing
        - Detection quality / precision
        - UI / visualisation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
